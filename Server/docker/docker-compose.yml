version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: clacs_postgres
    environment:
      POSTGRES_USER: clacs
      POSTGRES_PASSWORD: clacs
      POSTGRES_DB: clacslistening
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clacs -d clacslistening"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clacs_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  api:
    build: ..
    container_name: clacs_api
    env_file: ../.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ..
    container_name: clacs_worker
    env_file: ../.env
    depends_on:
      - api
    command: python -m arq app.workers.worker.WorkerSettings

volumes:
  postgres_data:
  redis_data:
